<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Rex 工作台" />
  <meta name="theme-color" content="#2563eb" />
  <title>Rex Pest Control 工作台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script>
    tailwind.config = { theme: { extend: { colors: { primary: '#2563eb', 'primary-light': '#eff6ff', 'primary-dark': '#1d4ed8' } } } }
  </script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
    .nav-item.active { background-color: #eff6ff; color: #2563eb; border-right: 3px solid #2563eb; }
    .calendar-day:hover { background-color: #eff6ff; }
    input, select, textarea { font-size: 16px; -webkit-appearance: none; appearance: none; }
    #app { height: 100vh; height: -webkit-fill-available; }
    html, body { height: 100%; }
    button { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 overflow-hidden">
  <div id="app" class="flex h-full">
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-30 w-64 bg-white border-r border-gray-200 transform -translate-x-full md:relative md:translate-x-0 transition-transform duration-200 flex flex-col">
      <div class="p-5 flex items-center gap-3 border-b border-gray-100">
        <div class="w-10 h-10 rounded-xl bg-primary text-white flex items-center justify-center text-lg font-bold shadow-sm">R</div>
        <div><h1 class="font-bold text-lg leading-tight">Rex 工作台</h1><p class="text-xs text-gray-500">Pest Control</p ></div>
      </div>
      <nav class="flex-1 px-3 py-4 space-y-1">
        <button onclick="app.nav('today')" data-nav="today" class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-50"><i class="fa-solid fa-calendar-day w-5 text-center"></i> 本日日程</button>
        <button onclick="app.nav('month')" data-nav="month" class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-50"><i class="fa-solid fa-calendar-days w-5 text-center"></i> 本月日程</button>
        <button onclick="app.nav('finance')" data-nav="finance" class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-50"><i class="fa-solid fa-file-invoice-dollar w-5 text-center"></i> 本月收支</button>
        <button onclick="app.nav('completed')" data-nav="completed" class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-50"><i class="fa-solid fa-clipboard-check w-5 text-center"></i> 已完成</button>
      </nav>
      <div class="p-4 border-t border-gray-100">
        <button onclick="app.loadDemo()" class="w-full text-xs text-gray-500 hover:text-primary border border-dashed border-gray-300 rounded-lg py-2"><i class="fa-solid fa-wand-magic-sparkles mr-1"></i> 载入示例数据</button>
      </div>
    </aside>
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/30 z-20 hidden md:hidden" onclick="app.toggleSidebar()"></div>
    <main class="flex-1 flex flex-col min-w-0">
      <header class="bg-white border-b border-gray-200 px-4 md:px-6 py-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <button onclick="app.toggleSidebar()" class="md:hidden text-gray-500 hover:text-primary p-1"><i class="fa-solid fa-bars text-xl"></i></button>
          <h2 id="page-title" class="text-lg md:text-xl font-bold">本日日程</h2>
        </div>
        <div id="current-date" class="text-sm text-gray-500"></div>
      </header>
      <div id="content" class="flex-1 overflow-auto p-4 md:p-6"></div>
    </main>
  </div>
