<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Rex 工作台" />
  <meta name="theme-color" content="#2563eb" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20180%20180%22%3E%3Crect%20width%3D%22180%22%20height%3D%22180%22%20rx%3D%2236%22%20fill%3D%22%232563eb%22%2F%3E%3Ctext%20x%3D%2290%22%20y%3D%22125%22%20font-family%3D%22Arial%2Csans-serif%22%20font-size%3D%22100%22%20font-weight%3D%22bold%22%20fill%3D%22white%22%20text-anchor%3D%22middle%22%3ER%3C%2Ftext%3E%3C%2Fsvg%3E" />
  <title>Rex Pest Control 工作台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#2563eb',
            'primary-light': '#eff6ff',
            'primary-dark': '#1d4ed8',
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Inter', system-ui, 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    .nav-item.active { background-color: #eff6ff; color: #2563eb; border-right: 3px solid #2563eb; }
    .slide-enter { transform: translateX(100%); }
    .slide-enter-active { transform: translateX(0); transition: transform .2s ease-out; }
    .calendar-day:hover { background-color: #eff6ff; }
    /* Safari 输入框不缩放：font-size ≥ 16px */
    input, select, textarea { font-size: 16px; }
    /* iOS Safari 100vh 修正 */
    #app { height: 100vh; height: -webkit-fill-available; }
    html, body { height: 100%; }
    /* 关闭 iOS 输入框默认圆角和阴影 */
    input[type=text], input[type=tel], input[type=number], input[type=date], input[type=time], select, textarea { -webkit-appearance: none; appearance: none; border-radius: 0.5rem; }
    /* 点击高亮 */
    button { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 overflow-hidden">
  <div id="app" class="flex h-full">
    <!-- Sidebar -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-30 w-64 bg-white border-r border-gray-200 transform -translate-x-full md:relative md:translate-x-0 transition-transform duration-200 flex flex-col">
      <div class="p-5 flex items-center gap-3 border-b border-gray-100">
        <div class="w-10 h-10 rounded-xl bg-primary text-white flex items-center justify-center text-lg font-bold shadow-sm">R</div>
        <div>
          <h1 class="font-bold text-lg leading-tight">Rex 工作台</h1>
          <p class="text-xs text-gray-500">Pest Control</p>
        </div>
      </div>
      <nav class="flex-1 px-3 py-4 space-y-1">
        <button onclick="app.nav('today')" data-nav="today" class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-50 transition">
          <i class="fa-solid fa-calendar-day w-5 text-center"></i> 本日日程
        </button>
        <button onclick="app.nav('month')" data-nav="month" class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-50 transition">
          <i class="fa-solid fa-calendar-days w-5 text-center"></i> 本月日程
        </button>
        <button onclick="app.nav('finance')" data-nav="finance" class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-50 transition">
          <i class="fa-solid fa-file-invoice-dollar w-5 text-center"></i> 本月收支
        </button>
        <button onclick="app.nav('completed')" data-nav="completed" class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-50 transition">
          <i class="fa-solid fa-clipboard-check w-5 text-center"></i> 已完成
        </button>
      </nav>
      <div class="p-4 border-t border-gray-100">
        <button onclick="app.loadDemo()" class="w-full text-xs text-gray-500 hover:text-primary border border-dashed border-gray-300 rounded-lg py-2">
          <i class="fa-solid fa-wand-magic-sparkles mr-1"></i> 载入示例数据
        </button>
        <p class="mt-3 text-[10px] text-gray-400 text-center">数据保存在本机浏览器中</p>
      </div>
    </aside>

    <!-- Overlay for mobile sidebar -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/30 z-20 hidden md:hidden" onclick="app.toggleSidebar()"></div>

    <!-- Main -->
    <main class="flex-1 flex flex-col min-w-0">
      <header class="bg-white border-b border-gray-200 px-4 md:px-6 py-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <button onclick="app.toggleSidebar()" class="md:hidden text-gray-500 hover:text-primary p-1">
            <i class="fa-solid fa-bars text-xl"></i>
          </button>
          <h2 id="page-title" class="text-lg md:text-xl font-bold text-gray-800">本日日程</h2>
        </div>
        <div id="current-date" class="text-sm text-gray-500"></div>
      </header>
      <div id="content" class="flex-1 overflow-auto p-4 md:p-6"></div>
    </main>
  </div>

  <!-- Detail Modal -->
  <div id="detail-modal" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black/40" onclick="app.closeDetail()"></div>
    <div class="absolute right-0 top-0 h-full w-full max-w-md bg-white shadow-2xl flex flex-col transform transition-transform duration-200 translate-x-full" id="detail-panel">
      <div class="px-5 py-4 border-b border-gray-100 flex items-center justify-between bg-primary-light">
        <h3 id="detail-title" class="font-bold text-lg text-gray-800">客户详情</h3>
        <button onclick="app.closeDetail()" class="text-gray-500 hover:text-gray-700 w-8 h-8 rounded-full hover:bg-white/60 flex items-center justify-center">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div class="flex-1 overflow-auto p-5 space-y-4">
        <input type="hidden" id="d-id" />
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-medium text-gray-500 mb-1">预约日期</label>
            <input type="date" id="d-date" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-base focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary" />
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-500 mb-1">预约时间</label>
            <input type="time" id="d-time" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-base focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary" />
          </div>
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-500 mb-1">地址</label>
          <div class="flex gap-2">
            <input type="text" id="d-address" placeholder="例如 123 Main St, Auckland" class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-base focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary min-w-0" />
            <a id="d-map" href="#" target="_blank" class="shrink-0 px-3 py-2 bg-gray-100 text-gray-600 rounded-lg text-sm hover:bg-primary hover:text-white transition">
              <i class="fa-solid fa-map-location-dot"></i>
            </a>
          </div>
          <p class="text-[10px] text-gray-400 mt-1">点击地图图标即可在 Google Maps 打开</p>
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-500 mb-1">联系电话</label>
          <input type="tel" inputmode="tel" id="d-contact" placeholder="客人手机号" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-base focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary" />
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-500 mb-1">服务类型</label>
          <select id="d-type" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-base focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary bg-white">
            <option value="月度">月度（每月同一天自动预约）</option>
            <option value="半月">半月（每两周自动预约）</option>
            <option value="单次">单次</option>
            <option value="回访">回访</option>
            <option value="停止服务">停止服务</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-500 mb-1">金额</label>
          <div class="relative">
            <span class="absolute left-3 top-2 text-gray-400 text-sm">$</span>
            <input type="number" inputmode="decimal" id="d-amount" step="0.01" min="0" placeholder="0.00" class="w-full border border-gray-300 rounded-lg pl-7 pr-3 py-2 text-base focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary" />
          </div>
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-500 mb-1">服务报告</label>
          <textarea id="d-report" rows="5" placeholder="填写服务内容、使用药剂、注意事项等..." class="w-full border border-gray-300 rounded-lg px-3 py-2 text-base focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary resize-none"></textarea>
        </div>
      </div>
      <div class="p-5 border-t border-gray-100 bg-gray-50 space-y-2">
        <button onclick="app.saveDetail()" class="w-full bg-primary hover:bg-primary-dark text-white font-medium py-2.5 rounded-lg transition">
          <i class="fa-solid fa-floppy-disk mr-2"></i>保存
        </button>
        <button id="btn-complete" onclick="app.completeService()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-medium py-2.5 rounded-lg transition">
          <i class="fa-solid fa-check mr-2"></i>完成服务
        </button>
        <button id="btn-delete" onclick="app.deleteService()" class="w-full border border-red-200 text-red-500 hover:bg-red-50 font-medium py-2 rounded-lg transition hidden">
          <i class="fa-regular fa-trash-can mr-2"></i>删除
        </button>
      </div>
    </div>
  </div>

  <!-- Day Modal -->
  <div id="day-modal" class="fixed inset-0 z-40 hidden">
    <div class="absolute inset-0 bg-black/40" onclick="app.closeDay()"></div>
    <div class="absolute bottom-0 md:top-0 md:right-0 h-[80%] md:h-full w-full md:max-w-sm bg-white shadow-2xl rounded-t-2xl md:rounded-none flex flex-col transform transition-transform duration-200 translate-y-full md:translate-x-full" id="day-panel">
      <div class="px-5 py-4 border-b border-gray-100 flex items-center justify-between bg-primary-light">
        <h3 id="day-title" class="font-bold text-lg text-gray-800">日程</h3>
        <button onclick="app.closeDay()" class="text-gray-500 hover:text-gray-700 w-8 h-8 rounded-full hover:bg-white/60 flex items-center justify-center">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div id="day-content" class="flex-1 overflow-auto p-5"></div>
      <div class="p-5 border-t border-gray-100 bg-gray-50">
        <button onclick="app.openDetail(null, app.dayModalDate)" class="w-full bg-primary hover:bg-primary-dark text-white font-medium py-2.5 rounded-lg transition">
          <i class="fa-solid fa-plus mr-2"></i>在该日新增预约
        </button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-gray-800 text-white text-sm px-5 py-2.5 rounded-full shadow-lg opacity-0 pointer-events-none transition-opacity duration-300 z-[60]"></div>

  <script>
    // Safari 兼容：crypto.randomUUID fallback
    function uuid() {
      if (window.crypto && typeof window.crypto.randomUUID === 'function') {
        return window.crypto.randomUUID();
      }
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
        const r = Math.random() * 16 | 0;
        const v = c === 'x' ? r : (r & 0x3 | 0x8);
        return v.toString(16);
      });
    }

    const app = {
      data: { services: [], expenses: [] },
      currentPage: 'today',
      monthView: new Date(),
      dayModalDate: null,
      editingId: null,

      init() {
        this.load();
        this.updateCurrentDate();
        this.nav('today');
      },

      load() {
        try {
          const raw = localStorage.getItem('rexWorkbenchData');
          if (raw) this.data = JSON.parse(raw);
        } catch (e) { console.error(e); }
      },

      save() {
        localStorage.setItem('rexWorkbenchData', JSON.stringify(this.data));
      },

      nav(page) {
        this.currentPage = page;
        document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.nav === page));
        const titles = { today: '本日日程', month: '本月日程', finance: '本月收支', completed: '已完成' };
        document.getElementById('page-title').textContent = titles[page];
        if (window.innerWidth < 768) this.toggleSidebar(false);
        this.render();
      },

      render() {
        const content = document.getElementById('content');
        content.innerHTML = '';
        if (this.currentPage === 'today') this.renderToday(content);
        else if (this.currentPage === 'month') this.renderMonth(content);
        else if (this.currentPage === 'finance') this.renderFinance(content);
        else if (this.currentPage === 'completed') this.renderCompleted(content);
      },

      // ---------- Helpers ----------
      todayStr() {
        return this.formatDate(new Date());
      },

      formatDate(d) {
        const date = new Date(d);
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
      },

      parseDate(str) {
        const [y, m, d] = str.split('-').map(Number);
        return new Date(y, m - 1, d);
      },

      monthLabel(d) {
        return d.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long' });
      },

      timeSort(a, b) {
        return (a.time || '00:00').localeCompare(b.time || '00:00');
      },

      serviceTypeColor(type) {
        switch (type) {
          case '月度': return 'bg-blue-100 text-blue-700';
          case '半月': return 'bg-indigo-100 text-indigo-700';
          case '单次': return 'bg-gray-100 text-gray-700';
          case '回访': return 'bg-amber-100 text-amber-700';
          case '停止服务': return 'bg-red-100 text-red-700';
          default: return 'bg-gray-100 text-gray-700';
        }
      },

      escapeHtml(str) {
        if (str == null) return '';
        return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
      },

      showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.remove('opacity-0');
        setTimeout(() => t.classList.add('opacity-0'), 2500);
      },

      toggleSidebar(force) {
        const sb = document.getElementById('sidebar');
        const ov = document.getElementById('sidebar-overlay');
        const show = force == null ? sb.classList.contains('-translate-x-full') : force;
        sb.classList.toggle('-translate-x-full', !show);
        ov.classList.toggle('hidden', !show);
      },

      updateCurrentDate() {
        document.getElementById('current-date').textContent = new Date().toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
      },

      // ---------- Today ----------
      renderToday(container) {
        const today = this.todayStr();
        const list = this.data.services
          .filter(s => s.date === today && s.status === 'scheduled')
          .sort(this.timeSort);

        const header = document.createElement('div');
        header.className = 'flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-6';
        header.innerHTML = `
          <div class="flex items-end gap-3">
            <span class="text-4xl font-bold text-primary">${list.length}</span>
            <span class="text-gray-500 mb-1">个今日待服务</span>
          </div>
          <button onclick="app.openDetail(null)" class="bg-primary hover:bg-primary-dark text-white px-4 py-2 rounded-lg text-sm font-medium shadow-sm transition self-start">
            <i class="fa-solid fa-plus mr-2"></i>新增预约
          </button>
        `;
        container.appendChild(header);

        if (!list.length) {
          container.innerHTML += `
            <div class="bg-white rounded-2xl border border-dashed border-gray-300 p-10 text-center">
              <div class="w-16 h-16 bg-primary-light text-primary rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                <i class="fa-solid fa-calendar-check"></i>
              </div>
              <h3 class="font-bold text-gray-700 mb-1">今天还没有预约</h3>
              <p class="text-sm text-gray-500 mb-4">点击右上角新增，或从月历中预约。</p>
              <button onclick="app.nav('month')" class="text-primary text-sm font-medium hover:underline">查看本月日程</button>
            </div>
          `;
          return;
        }

        const grid = document.createElement('div');
        grid.className = 'grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4';
        grid.innerHTML = list.map(s => this.serviceCard(s)).join('');
        container.appendChild(grid);
      },

      serviceCard(s) {
        return `
          <div onclick="app.openDetail('${s.id}')" class="bg-white rounded-xl p-4 border-l-4 border-primary shadow-sm hover:shadow-md transition cursor-pointer group">
            <div class="flex justify-between items-start mb-2">
              <span class="text-lg font-bold text-gray-800">${s.time || '--:--'}</span>
              <span class="text-xs px-2 py-1 rounded-full font-medium ${this.serviceTypeColor(s.type)}">${s.type}</span>
            </div>
            <div class="text-sm text-gray-600 mb-1"><i class="fa-solid fa-location-dot text-primary mr-2"></i>${this.escapeHtml(s.address) || '未填写地址'}</div>
            <div class="text-sm text-gray-500"><i class="fa-solid fa-phone text-primary mr-2"></i>${this.escapeHtml(s.contact) || '未填写电话'}</div>
            <div class="mt-3 flex items-center justify-between">
              <span class="text-sm font-semibold text-gray-700">$${Number(s.amount || 0).toFixed(2)}</span>
              <span class="text-xs text-primary group-hover:underline">查看详情 <i class="fa-solid fa-chevron-right text-[10px]"></i></span>
            </div>
          </div>
        `;
      },

      // ---------- Month ----------
      renderMonth(container) {
        const header = document.createElement('div');
        header.className = 'flex items-center justify-between mb-4';
        header.innerHTML = `
          <div class="flex items-center gap-2">
            <button onclick="app.shiftMonth(-1)" class="w-8 h-8 rounded-lg hover:bg-gray-200 text-gray-600"><i class="fa-solid fa-chevron-left"></i></button>
            <h3 class="text-lg font-bold min-w-[120px] text-center">${this.monthLabel(this.monthView)}</h3>
            <button onclick="app.shiftMonth(1)" class="w-8 h-8 rounded-lg hover:bg-gray-200 text-gray-600"><i class="fa-solid fa-chevron-right"></i></button>
          </div>
          <button onclick="app.monthView = new Date(); app.render();" class="text-sm text-primary font-medium hover:underline">回到今天</button>
        `;
        container.appendChild(header);

        const grid = document.createElement('div');
        grid.className = 'bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden';
        const days = ['日', '一', '二', '三', '四', '五', '六'];
        let html = `<div class="grid grid-cols-7 bg-gray-50 border-b border-gray-200">` +
          days.map(d => `<div class="py-2 text-center text-xs font-semibold text-gray-500">${d}</div>`).join('') +
          `</div><div class="grid grid-cols-7 auto-rows-fr">`;

        const year = this.monthView.getFullYear();
        const month = this.monthView.getMonth();
        const firstDay = new Date(year, month, 1);
        const start = new Date(year, month, 1 - firstDay.getDay());
        const today = this.todayStr();

        for (let i = 0; i < 42; i++) {
          const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
          const dateStr = this.formatDate(d);
          const inMonth = d.getMonth() === month;
          const isToday = dateStr === today;
          const dayServices = this.data.services.filter(s => s.date === dateStr && s.status === 'scheduled');
          const dots = dayServices.slice(0, 4).map(s =>
            `<span class="w-1.5 h-1.5 md:w-2 md:h-2 rounded-full ${s.status === 'completed' ? 'bg-emerald-500' : 'bg-primary'}"></span>`
          ).join('');

          html += `
            <div onclick="app.openDay('${dateStr}')" class="calendar-day min-h-[60px] md:min-h-[100px] border-b border-r border-gray-100 p-1.5 md:p-2 cursor-pointer flex flex-col justify-between ${inMonth ? 'bg-white' : 'bg-gray-50 text-gray-400'}">
              <div class="flex justify-between items-start">
                <span class="text-xs md:text-sm font-medium w-5 h-5 md:w-6 md:h-6 flex items-center justify-center rounded-full ${isToday ? 'bg-primary text-white' : ''}">${d.getDate()}</span>
              </div>
              <div class="flex flex-wrap gap-1 mt-1">${dots}</div>
            </div>
          `;
        }
        html += `</div>`;
        grid.innerHTML = html;
        container.appendChild(grid);
      },

      shiftMonth(delta) {
        this.monthView = new Date(this.monthView.getFullYear(), this.monthView.getMonth() + delta, 1);
        this.render();
      },

      openDay(dateStr) {
        this.dayModalDate = dateStr;
        const m = document.getElementById('day-modal');
        const p = document.getElementById('day-panel');
        const c = document.getElementById('day-content');
        const date = this.parseDate(dateStr);
        document.getElementById('day-title').textContent = date.toLocaleDateString('zh-CN', { month: 'long', day: 'numeric', weekday: 'long' });

        const list = this.data.services
          .filter(s => s.date === dateStr)
          .sort((a, b) => (b.status === 'scheduled' ? 1 : 0) - (a.status === 'scheduled' ? 1 : 0) || this.timeSort(a, b));

        if (!list.length) {
          c.innerHTML = `
            <div class="text-center py-10 text-gray-500">
              <i class="fa-regular fa-calendar-xmark text-3xl mb-3 text-gray-300"></i>
              <p class="text-sm">这一天还没有预约</p>
            </div>
          `;
        } else {
          c.innerHTML = list.map(s => `
            <div onclick="app.openDetail('${s.id}')" class="mb-3 bg-white border border-gray-200 rounded-xl p-3 cursor-pointer hover:border-primary transition">
              <div class="flex justify-between items-start mb-1">
                <span class="font-bold text-gray-800">${s.time || '--:--'}</span>
                <span class="text-xs px-2 py-0.5 rounded-full ${this.serviceTypeColor(s.type)}">${s.type}</span>
              </div>
              <div class="text-sm text-gray-600 truncate">${this.escapeHtml(s.address) || '无地址'}</div>
              <div class="mt-2 flex items-center justify-between">
                <span class="text-xs ${s.status === 'completed' ? 'text-emerald-600 font-medium' : 'text-gray-400'}">${s.status === 'completed' ? '已完成' : '待服务'}</span>
                <span class="text-sm font-semibold">$${Number(s.amount || 0).toFixed(2)}</span>
              </div>
            </div>
          `).join('');
        }

        m.classList.remove('hidden');
        setTimeout(() => {
          p.classList.remove('translate-y-full', 'md:translate-x-full');
        }, 10);
      },

      closeDay() {
        const m = document.getElementById('day-modal');
        const p = document.getElementById('day-panel');
        p.classList.add('translate-y-full', 'md:translate-x-full');
        setTimeout(() => m.classList.add('hidden'), 200);
      },

      // ---------- Detail Modal ----------
      openDetail(id, presetDate) {
        this.editingId = id || null;
        const modal = document.getElementById('detail-modal');
        const panel = document.getElementById('detail-panel');
        const title = document.getElementById('detail-title');
        const completeBtn = document.getElementById('btn-complete');
        const deleteBtn = document.getElementById('btn-delete');

        if (id) {
          const s = this.data.services.find(x => x.id === id);
          if (!s) return;
          title.textContent = '客户详情';
          document.getElementById('d-id').value = s.id;
          document.getElementById('d-date').value = s.date;
          document.getElementById('d-time').value = s.time || '';
          document.getElementById('d-address').value = s.address || '';
          document.getElementById('d-contact').value = s.contact || '';
          document.getElementById('d-type').value = s.type || '单次';
          document.getElementById('d-amount').value = s.amount || '';
          document.getElementById('d-report').value = s.report || '';
          completeBtn.classList.toggle('hidden', s.status === 'completed');
          deleteBtn.classList.remove('hidden');
        } else {
          title.textContent = '新增预约';
          document.getElementById('d-id').value = '';
          document.getElementById('d-date').value = presetDate || this.todayStr();
          document.getElementById('d-time').value = '09:00';
          document.getElementById('d-address').value = '';
          document.getElementById('d-contact').value = '';
          document.getElementById('d-type').value = '月度';
          document.getElementById('d-amount').value = '';
          document.getElementById('d-report').value = '';
          completeBtn.classList.add('hidden');
          deleteBtn.classList.add('hidden');
        }
        this.updateMapLink();

        modal.classList.remove('hidden');
        setTimeout(() => panel.classList.remove('translate-x-full'), 10);
      },

      closeDetail() {
        const modal = document.getElementById('detail-modal');
        const panel = document.getElementById('detail-panel');
        panel.classList.add('translate-x-full');
        setTimeout(() => modal.classList.add('hidden'), 200);
      },

      updateMapLink() {
        const addr = document.getElementById('d-address').value.trim();
        const link = document.getElementById('d-map');
        if (addr) {
          link.href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(addr)}`;
          link.classList.remove('pointer-events-none', 'opacity-50');
        } else {
          link.href = '#';
          link.classList.add('pointer-events-none', 'opacity-50');
        }
      },

      getDetailForm() {
        return {
          id: document.getElementById('d-id').value || uuid(),
          date: document.getElementById('d-date').value,
          time: document.getElementById('d-time').value,
          address: document.getElementById('d-address').value.trim(),
          contact: document.getElementById('d-contact').value.trim(),
          type: document.getElementById('d-type').value,
          amount: parseFloat(document.getElementById('d-amount').value) || 0,
          report: document.getElementById('d-report').value.trim(),
          status: 'scheduled'
        };
      },

      saveDetail() {
        const s = this.getDetailForm();
        if (!s.date || !s.time) {
          this.showToast('请填写日期和时间');
          return;
        }
        const idx = this.data.services.findIndex(x => x.id === s.id);
        if (idx >= 0) {
          const existing = this.data.services[idx];
          this.data.services[idx] = { ...existing, ...s, status: existing.status, completedAt: existing.completedAt };
        } else {
          this.data.services.push(s);
        }
        this.save();
        this.closeDetail();
        this.render();
        this.showToast('预约已保存');
      },

      completeService() {
        const s = this.getDetailForm();
        if (!s.date || !s.time) {
          this.showToast('请填写日期和时间');
          return;
        }
        const idx = this.data.services.findIndex(x => x.id === s.id);
        if (idx >= 0) {
          this.data.services[idx] = { ...this.data.services[idx], ...s, status: 'completed', completedAt: new Date().toISOString() };
        } else {
          s.status = 'completed';
          s.completedAt = new Date().toISOString();
          this.data.services.push(s);
        }

        // Auto-recur
        const nextDate = this.nextRecurringDate(s.date, s.type);
        if (nextDate) {
          const next = {
            id: uuid(),
            date: nextDate,
            time: s.time,
            address: s.address,
            contact: s.contact,
            type: s.type,
            amount: s.amount,
            report: '',
            status: 'scheduled'
          };
          this.data.services.push(next);
        }

        this.save();
        this.closeDetail();
        this.render();
        this.showToast(`服务已完成，收入 +$${s.amount.toFixed(2)}${nextDate ? '，已自动预约下一次' : ''}`);
      },

      nextRecurringDate(dateStr, type) {
        const d = this.parseDate(dateStr);
        if (type === '月度') {
          d.setMonth(d.getMonth() + 1);
        } else if (type === '半月') {
          d.setDate(d.getDate() + 14);
        } else {
          return null;
        }
        return this.formatDate(d);
      },

      deleteService() {
        const id = document.getElementById('d-id').value;
        if (!id) return;
        if (!confirm('确定删除这条预约？')) return;
        this.data.services = this.data.services.filter(s => s.id !== id);
        this.save();
        this.closeDetail();
        this.render();
        this.showToast('已删除');
      },

      // ---------- Finance ----------
      renderFinance(container) {
        const year = this.monthView.getFullYear();
        const month = this.monthView.getMonth();
        const start = this.formatDate(new Date(year, month, 1));
        const end = this.formatDate(new Date(year, month + 1, 0));

        const incomeServices = this.data.services.filter(s => s.status === 'completed' && s.date >= start && s.date <= end);
        const income = incomeServices.reduce((sum, s) => sum + (Number(s.amount) || 0), 0);
        const expenseItems = this.data.expenses.filter(e => e.date >= start && e.date <= end);
        const expense = expenseItems.reduce((sum, e) => sum + (Number(e.amount) || 0), 0);

        const header = document.createElement('div');
        header.className = 'flex items-center justify-between mb-4';
        header.innerHTML = `
          <h3 class="text-lg font-bold">${this.monthLabel(this.monthView)}</h3>
          <div class="flex gap-2">
            <button onclick="app.shiftFinanceMonth(-1)" class="w-8 h-8 rounded-lg hover:bg-gray-200 text-gray-600"><i class="fa-solid fa-chevron-left"></i></button>
            <button onclick="app.shiftFinanceMonth(1)" class="w-8 h-8 rounded-lg hover:bg-gray-200 text-gray-600"><i class="fa-solid fa-chevron-right"></i></button>
          </div>
        `;
        container.appendChild(header);

        const summary = document.createElement('div');
        summary.className = 'grid grid-cols-1 sm:grid-cols-3 gap-3 mb-6';
        summary.innerHTML = `
          <div class="bg-white rounded-xl p-4 shadow-sm border border-gray-200">
            <div class="text-xs text-gray-500 mb-1">本月进账</div>
            <div class="text-2xl font-bold text-emerald-600">$${income.toFixed(2)}</div>
            <div class="text-xs text-gray-400 mt-1">${incomeServices.length} 笔完成服务</div>
          </div>
          <div class="bg-white rounded-xl p-4 shadow-sm border border-gray-200">
            <div class="text-xs text-gray-500 mb-1">本月出账</div>
            <div class="text-2xl font-bold text-red-500">$${expense.toFixed(2)}</div>
            <div class="text-xs text-gray-400 mt-1">${expenseItems.length} 笔支出</div>
          </div>
          <div class="bg-white rounded-xl p-4 shadow-sm border border-gray-200">
            <div class="text-xs text-gray-500 mb-1">净收益</div>
            <div class="text-2xl font-bold text-primary">$${(income - expense).toFixed(2)}</div>
          </div>
        `;
        container.appendChild(summary);

        const wrap = document.createElement('div');
        wrap.className = 'grid grid-cols-1 lg:grid-cols-2 gap-6';

        // Income list
        wrap.innerHTML += `
          <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
            <div class="px-5 py-3 border-b border-gray-100 font-bold text-gray-700 flex items-center gap-2">
              <i class="fa-solid fa-arrow-trend-up text-emerald-500"></i> 进账明细
            </div>
            <div class="max-h-[400px] overflow-auto">
              ${incomeServices.length ? `
                <table class="w-full text-sm">
                  <thead class="bg-gray-50 text-gray-500 text-xs sticky top-0">
                    <tr><th class="px-4 py-2 text-left">日期</th><th class="px-4 py-2 text-left">类型</th><th class="px-4 py-2 text-right">金额</th></tr>
                  </thead>
                  <tbody>
                    ${incomeServices.sort((a,b)=>a.date.localeCompare(b.date)).map(s => `
                      <tr class="border-b border-gray-50 hover:bg-gray-50">
                        <td class="px-4 py-2">${s.date}</td>
                        <td class="px-4 py-2">${s.type}</td>
                        <td class="px-4 py-2 text-right font-medium text-emerald-600">$${Number(s.amount).toFixed(2)}</td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>` : `<div class="p-8 text-center text-gray-400 text-sm">暂无进账记录</div>`}
            </div>
          </div>
        `;

        // Expense list + form
        wrap.innerHTML += `
          <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden flex flex-col min-w-0">
            <div class="px-5 py-3 border-b border-gray-100 font-bold text-gray-700 flex items-center justify-between">
              <span><i class="fa-solid fa-arrow-trend-down text-red-500 mr-2"></i>出账明细</span>
            </div>
            <div class="p-4 border-b border-gray-100 bg-gray-50">
              <div class="flex flex-col md:flex-row gap-2">
                <input type="date" id="e-date" value="${this.todayStr()}" class="border border-gray-300 rounded-lg px-3 py-2 text-base w-full md:w-36 min-w-0" />
                <input type="number" inputmode="decimal" id="e-amount" step="0.01" min="0" placeholder="金额" class="border border-gray-300 rounded-lg px-3 py-2 text-base w-full md:w-28 min-w-0" />
                <input type="text" id="e-note" placeholder="支出说明" class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-base min-w-0" />
                <button onclick="app.addExpense()" class="bg-primary hover:bg-primary-dark text-white px-3 py-2 rounded-lg text-sm w-full md:w-auto"><i class="fa-solid fa-plus mr-1"></i>添加</button>
              </div>
            </div>
            <div class="flex-1 max-h-[320px] overflow-auto">
              ${expenseItems.length ? `
                <table class="w-full text-sm">
                  <thead class="bg-gray-50 text-gray-500 text-xs sticky top-0">
                    <tr><th class="px-4 py-2 text-left">日期</th><th class="px-4 py-2 text-left">说明</th><th class="px-4 py-2 text-right">金额</th><th class="px-4 py-2 text-center">操作</th></tr>
                  </thead>
                  <tbody>
                    ${expenseItems.sort((a,b)=>a.date.localeCompare(b.date)).map(e => `
                      <tr class="border-b border-gray-50 hover:bg-gray-50">
                        <td class="px-4 py-2">${e.date}</td>
                        <td class="px-4 py-2">${this.escapeHtml(e.note)}</td>
                        <td class="px-4 py-2 text-right font-medium text-red-500">$${Number(e.amount).toFixed(2)}</td>
                        <td class="px-4 py-2 text-center"><button onclick="app.deleteExpense('${e.id}')" class="text-gray-400 hover:text-red-500"><i class="fa-regular fa-trash-can"></i></button></td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>` : `<div class="p-8 text-center text-gray-400 text-sm">暂无支出记录</div>`}
            </div>
          </div>
        `;
        container.appendChild(wrap);
      },

      shiftFinanceMonth(delta) {
        this.monthView = new Date(this.monthView.getFullYear(), this.monthView.getMonth() + delta, 1);
        this.render();
      },

      addExpense() {
        const date = document.getElementById('e-date').value;
        const amount = parseFloat(document.getElementById('e-amount').value) || 0;
        const note = document.getElementById('e-note').value.trim();
        if (!date || amount <= 0) {
          this.showToast('请填写日期和金额');
          return;
        }
        this.data.expenses.push({ id: uuid(), date, amount, note });
        this.save();
        this.render();
        this.showToast('支出已记录');
      },

      deleteExpense(id) {
        this.data.expenses = this.data.expenses.filter(e => e.id !== id);
        this.save();
        this.render();
        this.showToast('支出已删除');
      },

      // ---------- Completed ----------
      renderCompleted(container) {
        const completed = this.data.services.filter(s => s.status === 'completed').sort((a, b) => new Date(b.completedAt || b.date) - new Date(a.completedAt || a.date));
        if (!completed.length) {
          container.innerHTML = `
            <div class="bg-white rounded-2xl border border-dashed border-gray-300 p-10 text-center">
              <div class="w-16 h-16 bg-primary-light text-primary rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                <i class="fa-solid fa-clipboard-check"></i>
              </div>
              <h3 class="font-bold text-gray-700 mb-1">暂无已完成服务</h3>
              <p class="text-sm text-gray-500">完成服务后会自动归档到这里。</p>
            </div>
          `;
          return;
        }
        const list = document.createElement('div');
        list.className = 'space-y-3';
        list.innerHTML = completed.map(s => `
          <div onclick="app.openDetail('${s.id}')" class="bg-white rounded-xl p-4 border border-gray-200 shadow-sm hover:shadow-md transition cursor-pointer flex flex-col md:flex-row md:items-center md:justify-between gap-3">
            <div>
              <div class="flex items-center gap-2 mb-1">
                <span class="text-sm font-bold text-gray-800">${s.date} ${s.time || ''}</span>
                <span class="text-xs px-2 py-0.5 rounded-full ${this.serviceTypeColor(s.type)}">${s.type}</span>
              </div>
              <div class="text-sm text-gray-600"><i class="fa-solid fa-location-dot text-primary mr-2"></i>${this.escapeHtml(s.address) || '无地址'}</div>
              <div class="text-sm text-gray-500"><i class="fa-solid fa-phone text-primary mr-2"></i>${this.escapeHtml(s.contact) || '无电话'}</div>
            </div>
            <div class="flex items-center md:flex-col md:items-end gap-2 md:gap-0">
              <div class="text-lg font-bold text-emerald-600">$${Number(s.amount).toFixed(2)}</div>
              <div class="text-xs text-gray-400">点击查看报告</div>
            </div>
          </div>
        `).join('');
        container.appendChild(list);
      },

      loadDemo() {
        if (this.data.services.length && !confirm('当前已有数据，载入示例会追加数据，继续吗？')) return;
        const base = new Date();
        const demo = [
          { date: this.formatDate(base), time: '09:30', address: '12 Queen St, Auckland CBD', contact: '021-123-4567', type: '月度', amount: 120, report: '常规除虫，喷洒厨房和花园。' },
          { date: this.formatDate(base), time: '14:00', address: '88 Broadway, Newmarket', contact: '021-987-6543', type: '半月', amount: 95, report: '' },
          { date: this.formatDate(new Date(base.getFullYear(), base.getMonth(), base.getDate() + 3)), time: '10:00', address: '45 Takapuna Rd, Takapuna', contact: '027-111-2222', type: '单次', amount: 150, report: '' },
        ];
        demo.forEach(d => this.data.services.push({ id: uuid(), status: 'scheduled', ...d }));
        this.save();
        this.render();
        this.showToast('示例数据已载入');
      }
    };

    // Address input map link update
    document.getElementById('d-address').addEventListener('input', () => app.updateMapLink());

    app.init();
  </script>
</body>
</html>
