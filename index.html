<style>

.justify-center{justify-content:center}
.gap-1{gap:4px}

.flex-shrink-0{flex-shrink:0}

.md-hide{display:none!important}

.md\\:relative{position:relative!important}
.md\\:inset-y-0{top:0;bottom:0}
.md\\:translate-x-full{transform:translateX(100%)}
.md\\:max-w-sm{max-width:360px}
.md\\:h-full{height:100%}

.md\\:right-0{right:0}
.md\\:grid-cols-2{grid:1fr 1fr/1fr 1fr;display:grid;gap:16px}
.md\\:grid-cols-3{grid:1fr 1fr 1fr/1fr 1fr 1fr;display:grid;gap:12px}
.md\\:flex-row{flex-direction:row}
.md\\:flex-col{flex-direction:column}
.md\\:items-center{align-items:center}
.md\\:items-end{align-items:end}
.md\\:justify-between{justify-content:space-between}
.md\\:hidden{display:none!important}
.md\\:w-28{width:112px}
.md\\:w-36{width:144px}
}
.grid{display:grid}
.grid-cols-2{grid:1fr 1fr/1fr 1fr;display:grid;gap:16px}
.grid-cols-7{grid:repeat(7,1fr)/repeat(7,1fr);display:grid}
@media(min-width:768px){
.md\\:grid-cols-2{grid:1fr 1fr/1fr 1fr;display:grid;gap:16px}
.md\\:grid-cols-3{grid:1fr 1fr 1fr/1fr 1fr 1fr;display:grid;gap:12px}
}
input,select,textarea{font-size:16px;width:100%;padding:8px 12px;border:1px solid #d1d5db;border-radius:8px;outline:none;background:#fff;-webkit-appearance:none;appearance:none}

textarea{resize:none}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 16px;border-radius:8px;font-size:14px;font-weight:500;width:100%}
.btn-primary{background:#2563eb;color:#fff}
.btn-green{background:#10b981;color:#fff}
.tag{font-size:11px;padding:3px 8px;border-radius:9999px;font-weight:500;display:inline-block}
.t-blue{background:#dbeafe;color:#1d4ed8}
.t-indigo{background:#e0e7ff;color:#4338ca}
.t-gray{background:#f3f4f6;color:#374151}
.t-amber{background:#fef3c7;color:#b45309}
.t-red{background:#fee2e2;color:#b91c1c}
.card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.05);border:1px solid #e5e7eb}
.nav-item.active{background:#eff6ff!important;color:#2563eb!important}
.cal-day{display:flex;flex-direction:column;justify-content:space-between;border-right:1px solid #f3f4f6;border-bottom:1px solid #f3f4f6;padding:6px;cursor:pointer;min-height:60px}
.cal-day:active{background:#eff6ff}
.today-circle{width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:#2563eb;color:#fff;font-size:13px;font-weight:500}
.dim{background:#f9fafb;color:#9ca3af}
.dot{width:6px;height:6px;border-radius:50%;background:#2563eb;display:inline-block}
.divider{padding:12px 20px;border-bottom:1px solid #f3f4f6;font-weight:700;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#f9fafb;color:#6b7280;font-size:11px;text-align:left;padding:8px 16px;font-weight:500;position:sticky;top:0}
td{padding:8px 16px;border-bottom:1px solid #f3f4f6}
.row{display:flex;justify-content:space-between;align-items:center}
</style>

<body>
<div id="app">
<aside id="sidebar" class="fixed inset-y-0 left-0 z-30" style="width:256px;background:#fff;border-right:1px solid #e5e7eb;display:flex;flex-direction:column;transform:translateX(-100%)">
<div style="padding:20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #f3f4f6">
<div style="width:40px;height:40px;border-radius:12px;background:#2563eb;color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700">R</div>
<div><div style="font-weight:700;font-size:17px;line-height:1.2">Rex 工作台</div><div style="font-size:11px;color:#6b7280">Pest Control</div></div>
</div>
<nav style="flex:1;padding:16px 12px">
<button onclick="A.nav('today')" data-nav="today" class="nav-item" style="display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:8px;width:100%;font-size:14px;font-weight:500;color:#4b5563;background:transparent;text-align:left;margin-bottom:4px"><span style="width:20px;text-align:center">📅</span>本日日程</button>
<button onclick="A.nav('month')" data-nav="month" class="nav-item" style="display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:8px;width:100%;font-size:14px;font-weight:500;color:#4b5563;background:transparent;text-align:left;margin-bottom:4px"><span style="width:20px;text-align:center">🗓</span>本月日程</button>
<button onclick="A.nav('finance')" data-nav="finance" class="nav-item" style="display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:8px;width:100%;font-size:14px;font-weight:500;color:#4b5563;background:transparent;text-align:left;margin-bottom:4px"><span style="width:20px;text-align:center">💰</span>本月收支</button>
<button onclick="A.nav('done')" data-nav="done" class="nav-item" style="display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:8px;width:100%;font-size:14px;font-weight:500;color:#4b5563;background:transparent;text-align:left;margin-bottom:4px"><span style="width:20px;text-align:center">✅</span>已完成</button>
</nav>
<div style="padding:16px;border-top:1px solid #f3f4f6">
<button onclick="A.demo()" style="width:100%;font-size:11px;color:#6b7280;border:1px dashed #d1d5db;border-radius:8px;padding:8px;background:transparent">载入示例</button>
</div>
</aside>
<div id="ov" class="fixed inset-0 bg-black/30 z-20 hidden" onclick="A.sb()" style="background:rgba(0,0,0,.3)"></div>
<main style="flex:1;display:flex;flex-direction:column;min-width:0;width:100%">
<header style="background:#fff;border-bottom:1px solid #e5e7eb;padding:12px 16px;display:flex;align-items:center;justify-content:space-between">
<div style="display:flex;align-items:center;gap:12px">
<button onclick="A.sb()" class="md-hide" style="background:transparent;color:#6b7280;font-size:20px;padding:4px">☰</button>
<h2 id="title" style="font-size:17px;font-weight:700;margin:0">本日日程</h2>
</div>
<div id="cdate" style="font-size:12px;color:#6b7280"></div>
</header>
<div id="content" style="flex:1;overflow:auto;padding:16px"></div>
</main>
</div>
<div id="dmodal" class="fixed inset-0 z-50 hidden">
<div class="fixed inset-0" style="background:rgba(0,0,0,.4)" onclick="A.cd()"></div>
<div id="dpanel" style="position:absolute;right:0;top:0;height:100%;width:100%;max-width:420px;background:#fff;box-shadow:0 25px 50px -12px rgba(0,0,0,.25);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .2s">
<div style="padding:16px 20px;border-bottom:1px solid #f3f4f6;display:flex;align-items:center;justify-content:space-between;background:#eff6ff">
<h3 id="dtitle" style="font-weight:700;font-size:17px;margin:0">客户详情</h3>
<button onclick="A.cd()" style="background:transparent;color:#6b7280;width:32px;height:32px;border-radius:50%">✕</button>
</div>
<div style="flex:1;overflow:auto;padding:20px">
<input type="hidden" id="f-id">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px">
<div><label style="display:block;font-size:11px;color:#6b7280;margin-bottom:4px">预约日期</label><input type="date" id="f-date"></div>
<div><label style="display:block;font-size:11px;color:#6b7280;margin-bottom:4px">预约时间</label><input type="time" id="f-time"></div>
</div>
<div style="margin-bottom:16px"><label style="display:block;font-size:11px;color:#6b7280;margin-bottom:4px">地址</label>
<div style="display:flex;gap:8px"><input type="text" id="f-addr" placeholder="123 Main St, Auckland" style="flex:1"><a id="f-map" href="#" target="_blank" style="flex-shrink:0;padding:8px 12px;background:#f3f4f6;color:#4b5563;border-radius:8px;text-decoration:none">🗺</a></div>
</div>
<div style="margin-bottom:16px"><label style="display:block;font-size:11px;color:#6b7280;margin-bottom:4px">联系电话</label><input type="tel" id="f-tel" placeholder="客人手机号"></div>
<div style="margin-bottom:16px"><label style="display:block;font-size:11px;color:#6b7280;margin-bottom:4px">服务类型</label><select id="f-type"><option value="月度">月度（每月同一天自动预约）</option><option value="半月">半月（每两周自动预约）</option><option value="单次">单次</option><option value="回访">回访</option><option value="停止服务">停止服务</option></select></div>
<div style="margin-bottom:16px"><label style="display:block;font-size:11px;color:#6b7280;margin-bottom:4px">金额（$）</label><input type="number" id="f-amt" step="0.01" min="0" placeholder="0.00"></div>
<div><label style="display:block;font-size:11px;color:#6b7280;margin-bottom:4px">服务报告</label><textarea id="f-rpt" rows="4" placeholder="服务内容、药剂、注意事项..."></textarea></div>
</div>
<div style="padding:20px;border-top:1px solid #f3f4f6;background:#f9fafb">
<div style="margin-bottom:8px"><button onclick="A.save()" class="btn btn-primary">💾 保存</button></div>
<div style="margin-bottom:8px"><button id="btn-done" onclick="A.done()" class="btn btn-green">✓ 完成服务</button></div>
<div><button id="btn-del" onclick="A.del()" style="width:100%;border:1px solid #fecaca;color:#ef4444;padding:10px;border-radius:8px;background:transparent;display:none">🗑 删除</button></div>
</div>
</div>
</div>
<div id="daymodal" class="fixed inset-0 z-40 hidden">
<div class="fixed inset-0" style="background:rgba(0,0,0,.4)" onclick="A.cday()"></div>
<div id="daypanel" style="position:absolute;bottom:0;right:0;height:80%;width:100%;max-width:360px;background:#fff;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .2s">
<div style="padding:16px 20px;border-bottom:1px solid #f3f4f6;display:flex;align-items:center;justify-content:space-between;background:#eff6ff">
<h3 id="daytitle" style="font-weight:700;font-size:17px;margin:0">日程</h3>
<button onclick="A.cday()" style="background:transparent;color:#6b7280;width:32px;height:32px;border-radius:50%">✕</button>
</div>
<div id="daycontent" style="flex:1;overflow:auto;padding:20px"></div>
<div style="padding:20px;border-top:1px solid #f3f4f6;background:#f9fafb"><button onclick="A.open(null,A.daydate)" class="btn btn-primary">＋ 在该日新增预约</button></div>
</div>
</div>
<div id="toast" style="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1f2937;color:#fff;font-size:13px;padding:10px 20px;border-radius:9999px;box-shadow:0 10px 15px rgba(0,0,0,.1);opacity:0;pointer-events:none;transition:opacity .3s;z-index:60">提示</div>
<script>
function uuid(){return(window.crypto&&crypto.randomUUID)?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c=='x'?r:(r&0x3|0x8)).toString(16)})}
const A={
data:{s:[],e:[]},
page:'today',
mv:new Date(),
daydate:null,
init(){this.load();document.getElementById('cdate').textContent=new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'});this.adjust();this.nav('today')},
adjust(){if(window.innerWidth>=768){document.getElementById('sidebar').style.transform='translateX(0)'}else{document.getElementById('sidebar').style.transform='translateX(-100%)'}},
load(){try{const r=localStorage.getItem('rexData');if(r)this.data=JSON.parse(r)}catch(e){}},
save(){localStorage.setItem('rexData',JSON.stringify(this.data))},
nav(p){this.page=p;document.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('active',el.dataset.nav===p));const t={today:'本日日程',month:'本月日程',finance:'本月收支',done:'已完成'};document.getElementById('title').textContent=t[p];if(window.innerWidth<768)this.sb(false);this.render()},
render(){const c=document.getElementById('content');c.innerHTML='';if(this.page==='today')this.rToday(c);else if(this.page==='month')this.rMonth(c);else if(this.page==='finance')this.rFin(c);else if(this.page==='done')this.rDone(c)},
tfmt(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),da=String(d.getDate()).padStart(2,'0');return`${y}-${m}-${da}`},
pdate(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)},
mlabel(d){return d.toLocaleDateString('zh-CN',{year:'numeric',month:'long'})},
tcolor(t){return{月度:'t-blue',半月:'t-indigo',单次:'t-gray',回访:'t-amber',停止服务:'t-red'}[t]||'t-gray'},
esc(s){return s==null?'':String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))},
toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.opacity='1';setTimeout(()=>t.style.opacity='0',2500)},
sb(f){const s=document.getElementById('sidebar'),o=document.getElementById('ov');const sh=f==null?s.style.transform==='translateX(-100%)':f;if(window.innerWidth<768){s.style.transform=sh?'translateX(0)':'translateX(-100%)';o.style.display=sh?'block':'none'}else{s.style.transform='translateX(0)';o.style.display='none'}},
rToday(c){const t=this.tfmt(new Date());const l=this.data.s.filter(x=>x.date===t&&x.status==='scheduled').sort((a,b)=>(a.time||'').localeCompare(b.time||''));let h=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px"><div style="display:flex;align-items:end;gap:12px"><span style="font-size:40px;font-weight:700;color:#2563eb">${l.length}</span><span style="color:#6b7280;margin-bottom:4px">个今日待服务</span></div><button onclick="A.open()" class="btn btn-primary" style="width:auto;padding:8px 16px">＋ 新增预约</button></div>`;if(!l.length){h+=`<div class="card" style="text-align:center;padding:40px;border-style:dashed"><div style="width:64px;height:64px;background:#eff6ff;color:#2563eb;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:24px">📅</div><h3 style="font-weight:700;margin:0 0 4px">今天还没有预约</h3><p style="font-size:13px;color:#6b7280;margin:0 0 16px">点击右上角新增，或从月历中预约。</p><button onclick="A.nav('month')" style="color:#2563eb;font-size:13px;background:transparent;border:none">查看本月日程</button></div>`}else{h+=`<div style="display:grid;grid-template-columns:1fr;gap:12px">`;l.forEach(s=>{h+=`<div onclick="A.open('${s.id}')" class="card" style="cursor:pointer;border-left:4px solid #2563eb;padding:16px"><div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:8px"><span style="font-size:18px;font-weight:700">${s.time||'--:--'}</span><span class="tag ${this.tcolor(s.type)}">${s.type}</span></div><div style="font-size:13px;color:#4b5563;margin-bottom:4px"><span style="color:#2563eb">📍</span> ${this.esc(s.addr)||'未填写'}</div><div style="font-size:13px;color:#6b7280"><span style="color:#2563eb">📞</span> ${this.esc(s.tel)||'未填写'}</div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px"><span style="font-size:14px;font-weight:600">$${Number(s.amt||0).toFixed(2)}</span><span style="font-size:11px;color:#2563eb">详情 →</span></div></div>`});h+=`</div>`}c.innerHTML=h},
rMonth(c){let h=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px"><div style="display:flex;align-items:center;gap:8px"><button onclick="A.sm(-1)" style="width:32px;height:32px;border-radius:8px;background:transparent;color:#4b5563">‹</button><h3 style="font-size:17px;font-weight:700;min-width:120px;text-align:center;margin:0">${this.mlabel(this.mv)}</h3><button onclick="A.sm(1)" style="width:32px;height:32px;border-radius:8px;background:transparent;color:#4b5563">›</button></div><button onclick="A.mv=new Date();A.render()" style="font-size:13px;color:#2563eb;background:transparent;border:none">今天</button></div>`;const days=['日','一','二','三','四','五','六'];h+=`<div class="card" style="padding:0;overflow:hidden"><div style="display:grid;grid-template-columns:repeat(7,1fr);background:#f9fafb;border-bottom:1px solid #e5e7eb">`;days.forEach(d=>h+=`<div style="padding:8px;text-align:center;font-size:11px;font-weight:600;color:#6b7280">${d}</div>`);h+=`</div><div style="display:grid;grid-template-columns:repeat(7,1fr)">`;const y=this.mv.getFullYear(),m=this.mv.getMonth(),fd=new Date(y,m,1),st=new Date(y,m,1-fd.getDay()),today=this.tfmt(new Date());for(let i=0;i<42;i++){const d=new Date(st.getFullYear(),st.getMonth(),st.getDate()+i),ds=this.tfmt(d),inM=d.getMonth()===m,isT=ds===today;const sv=this.data.s.filter(x=>x.date===ds&&x.status==='scheduled');let dots=sv.slice(0,4).map(()=>'<span class="dot"></span>').join('');h+=`<div onclick="A.openDay('${ds}')" class="cal-day ${inM?'':'dim'}"><span class="${isT?'today-circle':''}" style="font-size:13px;font-weight:500;${isT?'':'display:block;width:24px;height:24px;line-height:24px;text-align:center'}">${d.getDate()}</span><div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:4px">${dots}</div></div>`}h+=`</div></div>`;c.innerHTML=h},
sm(d){this.mv=new Date(this.mv.getFullYear(),this.mv.getMonth()+d,1);this.render()},
openDay(ds){this.daydate=ds;const m=document.getElementById('daymodal'),p=document.getElementById('daypanel'),cc=document.getElementById('daycontent');document.getElementById('daytitle').textContent=this.pdate(ds).toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'});const l=this.data.s.filter(x=>x.date===ds).sort((a,b)=>(b.status==='scheduled'?1:0)-(a.status==='scheduled'?1:0)||(a.time||'').localeCompare(b.time||''));if(!l.length){cc.innerHTML=`<div style="text-align:center;padding:40px;color:#6b7280"><div style="font-size:32px;margin-bottom:12px">📭</div><p style="font-size:13px">这一天还没有预约</p></div>`}else{cc.innerHTML=l.map(s=>`<div onclick="A.open('${s.id}')" class="card" style="margin-bottom:12px;cursor:pointer;padding:12px"><div style="display:flex;justify-content:space-between;margin-bottom:4px"><span style="font-weight:700">${s.time||'--:--'}</span><span class="tag ${this.tcolor(s.type)}">${s.type}</span></div><div style="font-size:13px;color:#4b5563;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${this.esc(s.addr)||'无地址'}</div><div style="display:flex;justify-content:space-between;margin-top:8px"><span style="font-size:11px;${s.status==='completed'?'color:#059669;font-weight:500':'color:#9ca3af'}">${s.status==='completed'?'已完成':'待服务'}</span><span style="font-size:14px;font-weight:600">$${Number(s.amt||0).toFixed(2)}</span></div></div>`).join('')}m.style.display='block';setTimeout(()=>p.style.transform='',10)},
cday(){const m=document.getElementById('daymodal'),p=document.getElementById('daypanel');p.style.transform='translateY(100%)';setTimeout(()=>m.style.display='none',200)},
open(id,pre){const m=document.getElementById('dmodal'),p=document.getElementById('dpanel'),t=document.getElementById('dtitle'),bd=document.getElementById('btn-done'),bl=document.getElementById('btn-del');if(id){const s=this.data.s.find(x=>x.id===id);if(!s)return;t.textContent='客户详情';document.getElementById('f-id').value=s.id;document.getElementById('f-date').value=s.date;document.getElementById('f-time').value=s.time||'';document.getElementById('f-addr').value=s.addr||'';document.getElementById('f-tel').value=s.tel||'';document.getElementById('f-type').value=s.type||'单次';document.getElementById('f-amt').value=s.amt||'';document.getElementById('f-rpt').value=s.rpt||'';bd.style.display=s.status==='completed'?'none':'flex';bl.style.display='block'}else{t.textContent='新增预约';document.getElementById('f-id').value='';document.getElementById('f-date').value=pre||this.tfmt(new Date());document.getElementById('f-time').value='09:00';document.getElementById('f-addr').value='';document.getElementById('f-tel').value='';document.getElementById('f-type').value='月度';document.getElementById('f-amt').value='';document.getElementById('f-rpt').value='';bd.style.display='flex';bl.style.display='none'}this.updMap();m.style.display='block';setTimeout(()=>p.style.transform='translateX(0)',10)},
cd(){const m=document.getElementById('dmodal'),p=document.getElementById('dpanel');p.style.transform='translateX(100%)';setTimeout(()=>m.style.display='none',200)},
updMap(){const a=document.getElementById('f-addr').value.trim(),l=document.getElementById('f-map');if(a){l.href=`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(a)}`;l.style.opacity='1';l.style.pointerEvents='auto'}else{l.href='#';l.style.opacity='.5';l.style.pointerEvents='none'}},
form(){return{id:document.getElementById('f-id').value||uuid(),date:document.getElementById('f-date').value,time:document.getElementById('f-time').value,addr:document.getElementById('f-addr').value.trim(),tel:document.getElementById('f-tel').value.trim(),type:document.getElementById('f-type').value,amt:parseFloat(document.getElementById('f-amt').value)||0,rpt:document.getElementById('f-rpt').value.trim(),status:'scheduled'}},
save(){const s=this.form();if(!s.date||!s.time){this.toast('请填写日期和时间');return}const i=this.data.s.findIndex(x=>x.id===s.id);if(i>=0){const ex=this.data.s[i];this.data.s[i]={...ex,...s,status:ex.status,completedAt:ex.completedAt}}else{this.data.s.push(s)}this.save();this.cd();this.render();this.toast('已保存')},
nextDate(ds,t){const d=this.pdate(ds);if(t==='月度')d.setMonth(d.getMonth()+1);else if(t==='半月')d.setDate(d.getDate()+14);else return null;return this.tfmt(d)},
done(){const s=this.form();if(!s.date||!s.time){this.toast('请填写日期和时间');return}const i=this.data.s.findIndex(x=>x.id===s.id);if(i>=0){this.data.s[i]={...this.data.s[i],...s,status:'completed',completedAt:new Date().toISOString()}}else{s.status='completed';s.completedAt=new Date().toISOString();this.data.s.push(s)}const nd=this.nextDate(s.date,s.type);if(nd){this.data.s.push({id:uuid(),date:nd,time:s.time,addr:s.addr,tel:s.tel,type:s.type,amt:s.amt,rpt:'',status:'scheduled'})}this.save();this.cd();this.render();this.toast(`完成 +$${s.amt.toFixed(2)}${nd?'，已自动预约下次':''}`)},
del(){const id=document.getElementById('f-id').value;if(!id)return;if(!confirm('删除这条预约？'))return;this.data.s=this.data.s.filter(x=>x.id!==id);this.save();this.cd();this.render();this.toast('已删除')},
rFin(c){const y=this.mv.getFullYear(),m=this.mv.getMonth(),st=this.tfmt(new Date(y,m,1)),ed=this.tfmt(new Date(y,m+1,0));const inc=this.data.s.filter(x=>x.status==='completed'&&x.date>=st&&x.date<=ed);const incT=inc.reduce((s,x)=>s+(+x.amt||0),0);const exp=this.data.e.filter(x=>x.date>=st&&x.date<=ed);const expT=exp.reduce((s,x)=>s+(+x.amt||0),0);let h=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px"><h3 style="font-size:17px;font-weight:700;margin:0">${this.mlabel(this.mv)}</h3><div style="display:flex;gap:8px"><button onclick="A.mv=new Date(${this.mv.getFullYear()},${this.mv.getMonth()-1},1);A.render()" style="width:32px;height:32px;border-radius:8px;background:transparent;color:#4b5563">‹</button><button onclick="A.mv=new Date(${this.mv.getFullYear()},${this.mv.getMonth()+1},1);A.render()" style="width:32px;height:32px;border-radius:8px;background:transparent;color:#4b5563">›</button></div></div>`;h+=`<div style="display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:24px">`;h+=`<div class="card" style="padding:16px;display:flex;justify-content:space-between;align-items:center;gap:12px"><div><div style="font-size:11px;color:#6b7280;margin-bottom:4px">本月进账</div><div style="font-size:24px;font-weight:700;color:#059669">$${incT.toFixed(2)}</div><div style="font-size:11px;color:#9ca3af;margin-top:4px">${inc.length} 笔</div></div><div style="font-size:32px">📈</div></div>`;h+=`<div class="card" style="padding:16px;display:flex;justify-content:space-between;align-items:center;gap:12px"><div><div style="font-size:11px;color:#6b7280;margin-bottom:4px">本月出账</div><div style="font-size:24px;font-weight:700;color:#ef4444">$${expT.toFixed(2)}</div><div style="font-size:11px;color:#9ca3af;margin-top:4px">${exp.length} 笔</div></div><div style="font-size:32px">📉</div></div>`;h+=`<div class="card" style="padding:16px;display:flex;justify-content:space-between;align-items:center;gap:12px"><div><div style="font-size:11px;color:#6b7280;margin-bottom:4px">净收益</div><div style="font-size:24px;font-weight:700;color:#2563eb">$${(incT-expT).toFixed(2)}</div></div><div style="font-size:32px">💵</div></div>`;h+=`</div>`;h+=`<div style="display:grid;grid-template-columns:1fr;gap:24px"><div class="card" style="padding:0;overflow:hidden"><div class="divider">📈 进账明细</div><div style="max-height:400px;overflow:auto">`;if(inc.length){h+=`<table><thead><tr><th>日期</th><th>类型</th><th style="text-align:right">金额</th></tr></thead><tbody>`;inc.sort((a,b)=>a.date.localeCompare(b.date)).forEach(s=>{h+=`<tr><td>${s.date}</td><td>${s.type}</td><td style="text-align:right;font-weight:500;color:#059669">$${Number(s.amt).toFixed(2)}</td></tr>`});h+=`</tbody></table>`}else h+=`<div style="padding:32px;text-align:center;color:#9ca3af;font-size:13px">暂无</div>`;h+=`</div></div><div class="card" style="padding:0;overflow:hidden;display:flex;flex-direction:column;min-width:0"><div class="divider">📉 出账明细</div><div style="padding:16px;border-bottom:1px solid #f3f4f6;background:#f9fafb"><div style="display:flex;flex-direction:column;gap:8px"><input type="date" id="e-date" value="${this.tfmt(new Date())}"><div style="display:flex;gap:8px"><input type="number" inputmode="decimal" id="e-amt" step="0.01" min="0" placeholder="金额" style="width:120px"><input type="text" id="e-note" placeholder="支出说明" style="flex:1"></div><button onclick="A.addExp()" class="btn btn-primary" style="width:auto">＋ 添加</button></div></div><div style="flex:1;max-height:320px;overflow:auto">`;if(exp.length){h+=`<table><thead><tr><th>日期</th><th>说明</th><th style="text-align:right">金额</th><th style="text-align:center">操作</th></tr></thead><tbody>`;exp.sort((a,b)=>a.date.localeCompare(b.date)).forEach(e=>{h+=`<tr><td>${e.date}</td><td>${this.esc(e.note)}</td><td style="text-align:right;font-weight:500;color:#ef4444">$${Number(e.amt).toFixed(2)}</td><td style="text-align:center"><button onclick="A.delExp('${e.id}')" style="background:transparent;color:#9ca3af">🗑</button></td></tr>`});h+=`</tbody></table>`}else h+=`<div style="padding:32px;text-align:center;color:#9ca3af;font-size:13px">暂无</div>`;h+=`</div></div></div></div>`;c.innerHTML=h},
addExp(){const d=document.getElementById('e-date').value,a=parseFloat(document.getElementById('e-amt').value)||0,n=document.getElementById('e-note').value.trim();if(!d||a<=0){this.toast('请填写日期和金额');return}this.data.e.push({id:uuid(),date:d,amt:a,note:n});this.save();this.render();this.toast('已记录')},
delExp(id){this.data.e=this.data.e.filter(x=>x.id!==id);this.save();this.render()},
rDone(c){const l=this.data.s.filter(x=>x.status==='completed').sort((a,b)=>new Date(b.completedAt||b.date)-new Date(a.completedAt||a.date));if(!l.length){c.innerHTML=`<div class="card" style="text-align:center;padding:40px;border-style:dashed"><div style="width:64px;height:64px;background:#eff6ff;color:#2563eb;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:24px">✅</div><h3 style="font-weight:700;margin:0 0 4px">暂无已完成</h3><p style="font-size:13px;color:#6b7280;margin:0">完成服务后会自动归档到这里。</p></div>`;return}let h=`<div style="display:flex;flex-direction:column;gap:12px">`;l.forEach(s=>{h+=`<div onclick="A.open('${s.id}')" class="card" style="cursor:pointer;display:flex;flex-direction:column;gap:12px"><div style="flex:1"><div style="display:flex;align-items:center;gap:8px;margin-bottom:4px"><span style="font-size:13px;font-weight:700">${s.date} ${s.time||''}</span><span class="tag ${this.tcolor(s.type)}">${s.type}</span></div><div style="font-size:13px;color:#4b5563;margin-bottom:4px"><span style="color:#2563eb">📍</span> ${this.esc(s.addr)||'无地址'}</div><div style="font-size:13px;color:#6b7280"><span style="color:#2563eb">📞</span> ${this.esc(s.tel)||'无电话'}</div></div><div style="text-align:right"><div style="font-size:18px;font-weight:700;color:#059669">$${Number(s.amt).toFixed(2)}</div><div style="font-size:11px;color:#9ca3af">点击查看报告</div></div></div>`});h+=`</div>`;c.innerHTML=h},
demo(){if(this.data.s.length&&!confirm('已有数据，追加示例？'))return;const b=new Date();[{date:this.tfmt(b),time:'09:30',addr:'12 Queen St, Auckland CBD',tel:'021-123-4567',type:'月度',amt:120,rpt:'常规除虫'},{date:this.tfmt(b),time:'14:00',addr:'88 Broadway, Newmarket',tel:'021-987-6543',type:'半月',amt:95,rpt:''},{date:this.tfmt(new Date(b.getFullYear(),b.getMonth(),b.getDate()+3)),time:'10:00',addr:'45 Takapuna Rd, Takapuna',tel:'027-111-2222',type:'单次',amt:150,rpt:''}].forEach(d=>this.data.s.push({id:uuid(),status:'scheduled',...d}));this.save();this.render();this.toast('示例已载入')}
};
document.getElementById('f-addr').addEventListener('input',()=>A.updMap());
